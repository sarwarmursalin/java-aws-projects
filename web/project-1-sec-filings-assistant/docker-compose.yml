services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: secfilings
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: secfilings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
